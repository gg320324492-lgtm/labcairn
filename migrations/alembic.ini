[alembic]
# Explicit, so Alembic does not fall back to splitting on spaces and
# commas, which is deprecated and warns on every invocation.
path_separator = os
script_location = %(here)s
prepend_sys_path = %(here)s/../src
# Path only. This is a local SQLite file, never a credential, and it is
# overridden per-invocation by tests via config.set_main_option("sqlalchemy.url", ...).
sqlalchemy.url = sqlite:///./labcairn.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
