# LC-P1-01 T06 — Python quality gate. Candidate REQUIRED status check.
#
# ============================================================================
# WHY THERE IS NO `paths-ignore` HERE — approved amendment C-1, binding
# ============================================================================
# GitHub reports a check that a `paths-ignore` filter removed as *expected*,
# not as *passed*. Branch protection waits for `expected` forever. So a
# reference-only pull request against a filtered required check leaves that
# check permanently unable to satisfy itself, and the pull request can never
# merge. Filtering does not make a job "optional"; it manufactures a deadlock.
#
# C-1 therefore requires every required `pull_request` status workflow to run
# unconditionally, and permits filtering only on optional or push-triggered
# workflows. This file is a required-check candidate on `pull_request`, so it
# declares `push` and `pull_request` with no path filter of any kind.
#
# This is also not a cost problem in practice: reference-study trees cannot be
# in the repository in the first place, so a path filter here would never fire
# anyway. `reference-exclusion` is the job that proves that, every run.
#
# ============================================================================
# WHAT THE OS MATRIX DOES AND DOES NOT MEAN — approved amendment C-6
# ============================================================================
# C-6: "Python lint/type/test CI on Ubuntu and Windows; Web initially can run
# on Ubuntu. This is not a real Windows application smoke test."
#
# Running the quality gates on `windows-latest` proves the lint, type and test
# commands behave on a Windows runner. It does NOT exercise a Windows build of
# a LabCairn application. LC-P1-01 shipped no executable, no CLI and no
# server, and that was why the matrix was not a smoke test; **LC-P1-12 has
# since shipped the CLI**, and its tests run it as a subprocess, so the
# windows job now does exercise the command line on Windows. The **server**
# is still not exercised: the API's tests drive it in process, through
# FastAPI's test client, and no Windows runner binds a socket. Do not
# describe this matrix as a Windows smoke test, and do not let a green run
# here stand in for one.
#
# ============================================================================
# TWO KINDS OF JOB — one `lint`, ten shard jobs
# ============================================================================
# `lint` runs the three static checks once: `ruff check .`,
# `ruff format --check .` and `mypy --strict`, on Ubuntu, with no matrix.
# The ten `python-quality` jobs run pytest only.
#
# **Why they were split.** The three checks used to run inside every shard
# job. That made one lint error turn all ten checks red, and paid for the
# same three commands ten times over. A lint job of its own is one check to
# read and one place to fix.
#
# **`lint` is a check, not yet a required check.** Branch protection is
# configured on GitHub, not in this file: until the owner adds `lint` to the
# required-status-check list, a failing `lint` job is reported but does not
# block a merge. Nothing in this workflow can make it required.
#
# **What this costs, stated plainly.** C-6's sentence names lint/type on
# Ubuntu and Windows. Lint and type checking now run on Ubuntu only; a
# Windows-only branch that `mypy` would judge differently is no longer
# judged on Windows. The shard jobs still run the whole test suite on both
# platforms, and the CLI is still exercised as a subprocess on Windows. If
# C-6 is to be kept literally, `lint` needs a two-platform matrix instead of
# one runner — that is an owner's decision, not a refactor.
name: python

on:
  # The push trigger runs on main only. A push to a feature branch is
  # already covered by that branch's pull_request event -- the same
  # workflow, the same tests, the same checks -- so running it again on
  # the push doubles the jobs for no new signal. C-1 forbids filtering the
  # *pull_request* trigger of a required workflow, and permits it on a
  # push-triggered one, and this is that: the required checks are on the
  # pull request, and main's own push is still covered.
  push:
    branches: [main]
  pull_request:
  # The evaluation harness runs on a schedule, not on every pull request.
  # A full offline run costs about 24 minutes on an Ubuntu runner (measured
  # per-file costs in `.github/ci-shards.json`, anchored at 49e81f2), and
  # the ten shard jobs already run the same files; adding it to
  # `pull_request` would make it the wall-clock bottleneck for a report that
  # can be produced periodically instead. The job is `evaluation`, below.
  #
  # **GitHub fires a schedule only from the default branch.** The first run
  # is therefore the first one after this workflow reaches `main`; a branch
  # run of a scheduled workflow silently never happens.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # One job, one check, one place for a lint error to be read. No matrix:
    # a matrix here would multiply the same three commands again, which is
    # the cost this job exists to remove.
    #
    # The name is plain `lint` because branch protection identifies a check
    # by name, and a name that carries an expression would be a different
    # check on every run. The owner adds this name to the required list.
    name: lint
    # The schedule spends one job — `evaluation` — not the thirteen that a
    # pull-request event spends. Without this guard, every scheduled run
    # would also repeat the static checks and all ten shards.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The interpreter comes from the committed `.python-version` rather than
      # a literal, so CI cannot drift away from the pin that
      # `requires-python = ">=3.12,<3.13"` in pyproject.toml declares
      # (approved amendment C-2, task-breakdown D-4).
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # uv is pinned to the version that produced and last validated uv.lock.
      # Pinned rather than "whatever is newest" so this gate stays reproducible
      # across weeks; [tool.uv] required-version in pyproject.toml carries the same pin.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # `strict = true` is set in pyproject.toml, and `files` is set there too,
      # so no path argument is needed or wanted here.
      - name: mypy --strict
        run: uv run mypy

  python-quality:
    # **The name carries the shard and the worker count, and it has to.**
    # GitHub identifies a check by its name, so jobs that share a name are
    # one check as far as branch protection is concerned — and a required
    # check satisfied by *any one* of them is a gate that only one shard has
    # to pass. The names are the gate, so they are made distinct.
    name: python-quality (${{ matrix.os }}, shard ${{ matrix.shard }})
    # A scheduled run spends `evaluation` only. The shards are the
    # pull-request gate, and repeating all ten of them on a schedule would
    # multiply the cost this workflow exists to keep measurable.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both operating systems report independently. C-6 wants an early
      # cross-platform signal, not a red Ubuntu run that hides a green Windows
      # one (or the reverse).
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        # The suite is split into shards, and each shard runs in its own job
        # on its own runner. The reason is measured, not guessed: the
        # Windows job spent 34.5 minutes and the Ubuntu job 17.5, and every
        # other required check together came to under two minutes, so the
        # suite was the whole of the wait. **The Windows runner is where the
        # time is**, and one runner doing everything is the worst possible
        # arrangement for a suite whose cost is spread unevenly.
        #
        # The shards are balanced against measured per-file costs, and the
        # balance is watched: `tests/test_ci_shard_coverage.py` fails if a
        # test file is in no shard, in two shards, or if the shards drift
        # apart. A file in no shard is a test CI never runs, and every other
        # check would stay green while it went.
        #
        # **Five, and not six, and the reason is the floor.** One file is
        # the floor: `tests/test_cli.py` takes 325 seconds on the Windows
        # runner and 216 on Ubuntu, and no arrangement of the other files
        # makes the shard it is in any shorter. So the wall clock is that
        # file plus the setup, and a sixth shard does not shorten it -- it
        # only adds a job. Measured on 2026-10-25: with six shards the
        # Ubuntu partition was 216 seconds against 135, a ratio of 1.60, and
        # the best arrangement those costs allow is 1.603 -- **so six shards
        # cannot satisfy the balance limit at all, and the partition that
        # could not be improved was the one that was rejected.** With five,
        # the same costs give 216 against 169 and the ratio is 1.28.
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        # Full history, because `test_status_consistency` decides whether a
        # `NOT STARTED` row is stale by asking whether any *merge commit*
        # names that work order. A depth-1 checkout has no merge commits, so
        # the check would skip on every CI run and look green while proving
        # nothing.
        with:
          fetch-depth: 0

      # The interpreter comes from the committed `.python-version` rather than
      # a literal, so CI cannot drift away from the pin that
      # `requires-python = ">=3.12,<3.13"` in pyproject.toml declares
      # (approved amendment C-2, task-breakdown D-4).
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # uv is pinned to the version that produced and last validated uv.lock.
      # Pinned rather than "whatever is newest" so this gate stays reproducible
      # across weeks; [tool.uv] required-version in pyproject.toml carries the same pin.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.21"
          # setup-uv's built-in cache covers the uv cache directory and the
          # managed-Python directory only — never the working tree — so there
          # is no artifact/cache step here whose `path:` could name a
          # reference-study directory.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen` fails if uv.lock disagrees with pyproject.toml, instead of
      # silently rewriting it. Lockfile drift is reported by `lockfiles.yml`.
      - run: uv sync --frozen

      # Lint and type checking run once, in the `lint` job above. They used
      # to be repeated here, in all ten shard jobs: one lint error turned
      # ten checks red, and the same three commands were paid for ten times.

      # This shard's files, and only this shard's. The shard list is read
      # from the file the workflow and the witness test both read, so the
      # two cannot disagree about what runs.
      #
      # `--dist loadfile` and not `load`: the suite's expensive fixtures are
      # module-scoped — the exit demonstration is run once per module, not
      # once per test — and `load` would give each worker its own copy of a
      # module-scoped fixture, so the demonstration would run once per worker
      # instead of once. `loadfile` also keeps a file's tests in their
      # collected order, so no test can come to depend on another test's side
      # effect.
      - name: the runner this job is on, and this shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          PLATFORM: ${{ matrix.os }}
        run: |
          echo "cores: $(python -c 'import os; print(os.cpu_count())')"
          echo "shard $SHARD: $(python -c "import json,os; d=json.load(open('.github/ci-shards.json')); print(' '.join(d['shards'][os.environ['PLATFORM']][int(os.environ['SHARD'])]))")"

      # **No `-n`.** The workers were measured on the runner and they lost:
      # eight workers made the whole-suite Ubuntu job 2.15 times faster but
      # the Windows job *slower* than one, and inside a shard they lost
      # again -- the Windows shard that took 741s with one worker took 961s
      # with four, and the Ubuntu one that took 158s took 202s. A shard is
      # now a quarter of the suite and a job on a runner of its own, so the
      # parallelism that is left is the parallelism between the jobs, and
      # that is free.
      #
      # `--durations=0` is what makes the next rebalance possible: the
      # per-file seconds come out of the log, and they have to come from the
      # runner, because a development machine gives a different order.
      - name: pytest
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          PLATFORM: ${{ matrix.os }}
        run: |
          files="$(python -c "import json,os; d=json.load(open('.github/ci-shards.json')); print(' '.join(d['shards'][os.environ['PLATFORM']][int(os.environ['SHARD'])]))")"
          uv run pytest $files --durations=0

      # The shard jobs upload no artifact, so none of their steps has a
      # `path:` that could sweep the working tree into a downloadable
      # bundle. The only artifact in this workflow is uploaded by the
      # `evaluation` job below, and its path is the harness's own report
      # directory under the runner's temp — outside the checkout.

  # ==========================================================================
  # THE EVALUATION HARNESS — a scheduled report, not a pull-request gate
  # ==========================================================================
  #
  # `python -m tests.evaluation` runs the protocol's gate classes and writes
  # the Phase 1 blocker table with its denominators. It is not on
  # `pull_request` because a full offline run costs about 24 minutes on an
  # Ubuntu runner (the measured per-file costs in `.github/ci-shards.json`,
  # anchored at 49e81f2, sum to 1450.0 s over the five offline classes), and
  # the ten shard jobs already run the same files. A pull-request job would
  # become the wall-clock bottleneck for a report that can be produced
  # periodically instead.
  #
  # **The five offline classes, and not four.** A blocker is held only when
  # every one of its witnesses was collected and passed, and the witnesses
  # span all five classes. `--classes unit` passed 1789/1789 and still
  # exited 1, because five of the six blockers became NOT_EVALUATED; that
  # was measured on 2026-11-03. The fifth protocol class, `real_model_smoke`,
  # is NOT SELECTED here: it is discharged by `provider-smoke.yml`, on the
  # owner's 2026-10-28 ruling.
  #
  # **No `continue-on-error`.** If the harness fails, the job is red and the
  # report is in the log; that is the signal. The job is not a required
  # check, and a scheduled job cannot satisfy a pull-request required check
  # in any case.
  evaluation:
    name: evaluation
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      - name: the evaluation harness over the offline classes
        run: |
          uv run python -m tests.evaluation \
            --classes unit,integration,negative,e2e,repository \
            --out "$RUNNER_TEMP/evaluation-report"

      # The report is the product, so it is printed whether the harness
      # passed or failed. If the harness did not write it, this step fails —
      # a run whose report is missing is not a run whose result can be read.
      - name: print the report to the log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/evaluation-report/evaluation-report.md"

      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: ${{ runner.temp }}/evaluation-report
          if-no-files-found: error
