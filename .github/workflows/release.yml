# LC-P1-14 T07 — The release's own contents.
#
# ============================================================================
# What this workflow is for
# ============================================================================
# The `reference-exclusion` gate already decides what a distribution must NOT
# contain. This workflow decides what it MUST contain, and it decides it the
# same way: by comparing member lists, member by member, rather than by
# reading a manifest and believing it.
#
# It runs four kinds of check, and each one is either a check an existing gate
# already established or a measured fact about what a release actually is:
#
#   1. The gates this release must not contradict. The reference-exclusion
#      gate's own test file is run here verbatim, the lockfiles are checked
#      the way `lockfiles.yml` checks them, and the secret scan is the
#      git-mode scan `security.yml` runs. A release workflow that re-decided
#      these differently would be a second, weaker version of a gate that
#      already exists.
#
#   2. The release's own member lists — the source distribution and the
#      wheel, each compared against a list derived from the tree rather than
#      a hardcoded one.
#
#   3. The NOTICE travels with both artefacts, and neither artefact carries a
#      font file or a binary the project did not write.
#
#   4. The dependency closure's licences, read out of the installed
#      distributions themselves, so that a dependency arriving under a licence
#      nobody recorded fails the release instead of quietly shipping.
#
# ============================================================================
# THE BUILD RUNS BEFORE ANYTHING WRITES INTO THE WORKING TREE
# ============================================================================
# Measured, not assumed: the build backend's source-distribution target does
# NOT consult `.gitignore`. A file that git ignores — `web/node_modules/`
# after a pnpm install, a stray `*.db`, a `build/` directory — lands in the
# source distribution unless the backend excludes it by name. The default
# exclusions are a short fixed list: `dist/`, `.venv/`, `__pycache__/` and
# `*.pyc` were excluded when the same files were planted, and nothing else
# was.
#
# So the artefacts are built while the working tree is still exactly the
# checkout, and the member-list check below compares them against
# `git ls-tree HEAD`. If a step is ever moved above the build and writes into
# the tree, the check fails and says so — which is the point of the check.
#
# The sibling workflow `reference-exclusion.yml` already builds its release
# source archive with `git archive HEAD`, never `zip -r` over the working
# tree, and this workflow keeps the same discipline by keeping the tree clean
# at build time.
#
# ============================================================================
# C-1 (binding) — no `paths-ignore`, no `paths`, on any trigger
# ============================================================================
# GitHub reports a filtered check as *expected* rather than *passed*, so a
# filtered required check blocks every merge forever. This workflow declares
# no path filter on any trigger, for the same reason `python.yml` does not.
# The `pull_request` trigger is deliberately unfiltered: a release gate that
# only ran on the day someone tagged would be a gate nobody had ever run.
# ============================================================================
#
# The gitleaks binary is downloaded from the official release and checked
# against a pinned SHA-256 before it is executed — no `curl | sh`. The version
# and the checksum are the ones published in that release's checksums file.
# The scan runs in git mode, never in whole-disk mode: a whole-disk scan
# would read every clone on the machine, and those are not files this
# repository is responsible for.
name: release

on:
  # A tag is the release event. The pattern is narrow so that an ordinary
  # tag does not start a release build.
  push:
    tags: ["v*"]
  # Unfiltered, so the release checks are exercised on every pull request
  # rather than first being run on the commit that publishes.
  pull_request:
  # The owner can re-run the checks on any ref without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # The artefacts, the member lists and the gates the release must not
  # contradict.
  # =========================================================================
  release-contents:
    name: release-contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing downstream shells out with the token, so the checkout
          # credential is dropped as soon as the clone is made.
          persist-credentials: false

      # The same assertion the reference-exclusion gate makes: a `git init`
      # rooted too high is an operating-procedure incident that no in-repo
      # rule can prevent. This step detects it; it does not stop it.
      - name: assert the checkout root is the workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$(git rev-parse --show-toplevel)"
          if [ "${root}" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::checkout root ${root} is not the workspace ${GITHUB_WORKSPACE}"
            exit 1
          fi
          echo "checkout root confirmed: ${root}"

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # Pinned to the version that produced uv.lock. The repository records
          # the pin as [tool.uv] required-version in pyproject.toml.
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # =========================================================================
      # The artefacts — built while the working tree is still just the checkout
      # =========================================================================
      - name: uv build
        run: uv build

      # =========================================================================
      # 1. The dependency lockfiles — the same check `lockfiles.yml` makes
      # =========================================================================
      - name: uv.lock is consistent with pyproject.toml
        run: uv lock --check

      # =========================================================================
      # 2. The release's own member lists
      # =========================================================================
      - name: the release's own member lists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          # A font file, by name. The distribution must carry none: no third
          # party font may reach a user through LabCairn's own artefacts.
          #
          # **The set names the formats a font arrives in, not only the ones
          # that were once measured.** reportlab ships `DarkGarden.sfd` -- the
          # *source* of a GPL v2 font, and the very file the font licence
          # audit names -- and a browser ships `.woff2`; a check that knew
          # only `.ttf` would have let either of them into a source
          # distribution under a name it did not recognise. The list is read
          # by `tests/test_release_workflow.py`, which compares it with the
          # fonts the audit names and runs this very program over a tree
          # that carries one.
          FONT_SUFFIXES = {
              ".ttf", ".otf", ".ttc", ".otc",
              ".pfb", ".pfa", ".afm", ".pfm",
              ".sfd", ".bdf", ".pcf",
              ".woff", ".woff2", ".eot",
          }

          dist = Path("dist")
          sdists = sorted(dist.glob("*.tar.gz"))
          wheels = sorted(dist.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(
                  f"expected exactly one sdist and one wheel, got "
                  f"{[p.name for p in sdists]} and {[p.name for p in wheels]}"
              )
          sdist, wheel = sdists[0], wheels[0]

          failures = []

          # --- the source distribution -------------------------------------
          # Its member list is the committed tree's file list plus the one
          # file the build backend adds. Asserted as an equality against
          # `git ls-tree`, not against a hardcoded list: the list would break
          # every time a file is legitimately added or renamed, and would
          # tempt someone into deleting the assertion instead of fixing it.
          with tarfile.open(sdist) as archive:
              names = sorted(m.name for m in archive.getmembers() if m.isfile())
          if not names:
              raise SystemExit("the source distribution is empty")
          root = names[0].split("/", 1)[0] + "/"
          sdist_members = sorted(n[len(root):] for n in names if n.startswith(root))

          tree = sorted(
              line.strip()
              for line in subprocess.run(
                  ["git", "ls-tree", "-r", "--name-only", "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              if line.strip()
          )
          if not tree:
              raise SystemExit("HEAD is an empty tree; the comparison would be vacuous")

          missing = [p for p in tree if p not in set(sdist_members)]
          extra = [p for p in sdist_members if p not in set(tree)]
          if missing:
              failures.append(
                  f"these committed files are missing from {sdist.name}: {missing}"
              )
          if extra != ["PKG-INFO"]:
              failures.append(
                  f"{sdist.name} carries members the committed tree does not: {extra}. "
                  "The build backend adds PKG-INFO and nothing else. A file that "
                  "is not committed but is in the working tree also lands here — "
                  "the build backend does not read .gitignore — so the tree must "
                  "be clean when `uv build` runs."
              )

          # --- the wheel ----------------------------------------------------
          with zipfile.ZipFile(wheel) as archive:
              wheel_members = sorted(archive.namelist())
          version = wheel.name.split("-")[1]
          dist_info = f"labcairn-{version}.dist-info"
          package = [m for m in wheel_members if not m.startswith(dist_info + "/")]
          metadata = [m for m in wheel_members if m.startswith(dist_info + "/")]

          source_files = sorted(
              f"labcairn/{p.relative_to('src/labcairn').as_posix()}"
              for p in Path("src/labcairn").rglob("*")
              if p.is_file()
          )
          if not source_files:
              raise SystemExit("no files found under src/labcairn to compare")
          missing = [p for p in source_files if p not in set(package)]
          if missing:
              failures.append(
                  f"files under src/labcairn are missing from {wheel.name}: {missing}. "
                  "The wheel package root is not recursive."
              )
          extra = [p for p in package if p not in set(source_files)]
          if extra:
              failures.append(
                  f"{wheel.name} carries package members that are not in the "
                  f"source tree: {extra}"
              )

          # The wheel's metadata is exactly the six files the release
          # declares. A seventh would be a licence file this project has not
          # decided on, and it would ship without anybody deciding.
          expected_metadata = {
              f"{dist_info}/METADATA",
              f"{dist_info}/RECORD",
              f"{dist_info}/WHEEL",
              f"{dist_info}/entry_points.txt",
              f"{dist_info}/licenses/LICENSE.PENDING.md",
              f"{dist_info}/licenses/NOTICE",
          }
          if set(metadata) != expected_metadata:
              failures.append(
                  f"{wheel.name} metadata members differ from the declared six:\n"
                  f"  only in the wheel: {sorted(set(metadata) - expected_metadata)}\n"
                  f"  only in the declaration: {sorted(expected_metadata - set(metadata))}"
              )

          # The wheel carries no binary. Every package member is Python
          # source or the py.typed marker, so no font, no image and no
          # archive can reach a user through the wheel.
          binary = [
              m for m in package
              if not (m.endswith(".py") or m.endswith(".typed"))
          ]
          if binary:
              failures.append(f"{wheel.name} carries non-source package members: {binary}")

          # --- neither artefact carries a font file ------------------------
          for label, members in (
              (sdist.name, sdist_members),
              (wheel.name, wheel_members),
          ):
              fonts = sorted(m for m in members if Path(m).suffix.lower() in FONT_SUFFIXES)
              if fonts:
                  failures.append(f"{label} carries font files: {fonts}")

          # --- the NOTICE travels with both --------------------------------
          if "NOTICE" not in sdist_members:
              failures.append(f"{sdist.name} does not carry the NOTICE")
          if f"{dist_info}/licenses/NOTICE" not in wheel_members:
              failures.append(f"{wheel.name} does not carry the NOTICE")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              raise SystemExit(1)

          print(f"source distribution: {len(sdist_members)} members "
                f"(= the committed tree plus PKG-INFO)")
          print(f"wheel:              {len(wheel_members)} members "
                f"({len(package)} package, {len(metadata)} metadata)")
          print("the release's member lists hold: neither missing nor extra")
          PY

      # =========================================================================
      # 1. The secret scan — the same scan `security.yml` runs, in git mode
      # =========================================================================
      - name: install gitleaks (pinned release, checksum verified)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt in that release.
          GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${GITLEAKS_SHA256_LINUX_X64}  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: scan tracked history
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

      # =========================================================================
      # 1. The web lockfile — the same check `lockfiles.yml` makes
      #
      # This step runs AFTER the build on purpose: `pnpm install` writes
      # `web/node_modules/` into the working tree, and the build backend's
      # source-distribution target does not read `.gitignore`, so a build
      # after this step would ship the installed packages.
      # =========================================================================
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          package_json_file: web/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: web/pnpm-lock.yaml is consistent with web/package.json
        working-directory: web
        run: pnpm install --frozen-lockfile

      # =========================================================================
      # 1. The reference-exclusion gate — its own gate, run verbatim
      # =========================================================================
      # It builds its artefacts in a throwaway copy of the project and asserts
      # the tracked set, the ignore behaviour, the sdist and wheel member
      # names, the git archive and the CI-workflow rules. A release gate that
      # left this out would be checking the packaging without the packaging
      # gate. Its build happens in a temporary directory, so it does not
      # disturb the artefacts this workflow uploaded.
      - name: reference-exclusion acceptance gate
        run: uv run pytest tests/test_no_reference_leakage.py

      # =========================================================================
      # The artefacts
      # =========================================================================
      # Every `path:` below is a narrow, named build-output pattern — never
      # `.`, `./`, `*` or `**`. An artifact is a source bundle and carries
      # whatever it is handed, so a broad path would sweep the whole working
      # tree into a published download.
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

  # =========================================================================
  # The dependency closure's licences.
  #
  # On both platforms, because the closure is platform-dependent: 167
  # distributions install on Linux and 168 on Windows, and the four that
  # differ are exactly the ones a single-platform audit would never read.
  # One distribution — httpx2-jsfetch — installs on no supported platform at
  # all, and its licence is recorded in NOTICE instead.
  #
  # The job's name carries the matrix leg. Two jobs sharing a name are ONE
  # check as far as branch protection is concerned, so the platform has to be
  # in the name.
  # =========================================================================
  release-dependency-licences:
    name: release-dependency-licences (matrix.os)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: resolve the runtime dependency closure
        shell: bash
        env:
          RELEASE_REQUIREMENTS: ${{ runner.temp }}/release-requirements.txt
          RELEASE_AUDIT_VENV: ${{ runner.temp }}/release-audit
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --format requirements.txt > "${RELEASE_REQUIREMENTS}"
          echo "runtime closure: $(grep -cE '^[A-Za-z0-9]' "${RELEASE_REQUIREMENTS}") requirements"
          uv venv --python "$(tr -d '[:space:]' < .python-version)" "${RELEASE_AUDIT_VENV}"
          if [ -x "${RELEASE_AUDIT_VENV}/bin/python" ]; then
            PY="${RELEASE_AUDIT_VENV}/bin/python"
          else
            PY="${RELEASE_AUDIT_VENV}/Scripts/python.exe"
          fi
          uv pip install --python "${PY}" -r "${RELEASE_REQUIREMENTS}"

      - name: every dependency's licence is read from the distribution itself
        shell: bash
        env:
          # **The export's path travels with the venv's path.** The two
          # steps are separate, and an env var set in one is not set in the
          # next -- so the file the first step wrote is named again here, in
          # the one place that reads it. Without this the audit fell back to
          # a relative name, found nothing there, and died with a bare
          # `FileNotFoundError` that said nothing about the cause.
          RELEASE_REQUIREMENTS: ${{ runner.temp }}/release-requirements.txt
          RELEASE_AUDIT_VENV: ${{ runner.temp }}/release-audit
        run: |
          set -euo pipefail
          if [ -x "${RELEASE_AUDIT_VENV}/bin/python" ]; then
            PY="${RELEASE_AUDIT_VENV}/bin/python"
          else
            PY="${RELEASE_AUDIT_VENV}/Scripts/python.exe"
          fi
          "${PY}" - <<'PY'
          import os
          import re
          import sys
          from collections import Counter
          from importlib import metadata
          from pathlib import Path

          try:
              from packaging.markers import Marker
          except ImportError:
              raise SystemExit(
                  "packaging is not installed in the audit environment, so the "
                  "platform markers in the export cannot be evaluated and the "
                  "closure cannot be compared against what was installed"
              )

          # --- the licences that need no condition -------------------------
          PERMISSIVE = {
              "MIT", "MIT-0", "MIT-CMU", "Apache-2.0", "BSD-2-Clause",
              "BSD-3-Clause", "ISC", "PSF-2.0", "Unlicense", "0BSD", "Zlib",
              "CC0-1.0", "CNRI-Python", "OFL-1.1", "FTL", "Qhull",
              "Bitstream-Charter", "BaKoMa Fonts Licence",
              "GPL-3.0-or-later WITH GCC-exception-3.1",
          }

          # --- the licences that do, each with the distributions allowed to
          # --- carry it. A new one fails the release until a person reads it
          # --- and adds it here, with the reason.
          CONDITIONAL = {
              # MPL 2.0 is file-level copyleft. Neither of these is modified
              # by LabCairn and neither is redistributed by it.
              "MPL-2.0": {"certifi", "tqdm"},
          }

          CLASSIFIER_LABELS = {
              "MIT License": "MIT",
              "Apache Software License": "Apache-2.0",
              "BSD License": "BSD-3-Clause",
              "ISC License (ISCL)": "ISC",
              "Python Software Foundation License": "PSF-2.0",
              "Mozilla Public License 2.0 (MPL 2.0)": "MPL-2.0",
              "The Unlicense (Unlicense)": "Unlicense",
          }

          TEXT_RULES = (
              ("Apache-2.0", re.compile(r"Apache License", re.I)),
              ("MIT", re.compile(r"The MIT License|Permission is hereby granted, free of charge", re.I)),
              ("BSD-3-Clause", re.compile(
                  r"Redistributions of source code must retain the above copyright\s+notice"
                  r".*?Neither the name", re.I | re.S)),
              ("BSD-2-Clause", re.compile(
                  r"Redistributions of source code must retain the above copyright\s+notice", re.I | re.S)),
              ("ISC", re.compile(r"Permission to use, copy, modify, and/or distribute this software", re.I)),
              ("PSF-2.0", re.compile(r"PYTHON SOFTWARE FOUNDATION LICENSE VERSION 2", re.I)),
              ("MPL-2.0", re.compile(r"Mozilla Public License", re.I)),
              ("Unlicense", re.compile(
                  r"This is free and unencumbered software released into the public domain", re.I)),
              ("CC0-1.0", re.compile(r"Creative Commons Zero|CC0 1\.0 Universal", re.I)),
              ("Zlib", re.compile(
                  r"This software is provided 'as-is', without any express or implied warranty", re.I)),
              ("0BSD", re.compile(
                  r"Permission to use, copy, modify, and/or distribute this software for any purpose", re.I)),
              ("CNRI-Python", re.compile(r"CNRI OPEN SOURCE LICENSE AGREEMENT", re.I)),
              ("MIT-CMU", re.compile(r"CMU License", re.I)),
              ("MIT-0", re.compile(r"MIT No Attribution", re.I)),
          )

          LICENCE_FILE_NAME = re.compile(r"^(LICEN[CS]E|COPYING|NOTICE|AUTHORS)", re.I)
          LICENCE_DIR_NAME = re.compile(r"^(licen[cs]es?|copying|notice)$", re.I)
          SPDX_TOKEN = re.compile(r"\b[A-Za-z][A-Za-z0-9.+-]*-[0-9][0-9A-Za-z.+-]*\b")

          def canonical(name):
              # PEP 503: the PyPI name and the installed name differ in
              # punctuation (jaraco-classes installs as jaraco.classes), and
              # comparing them without this says one is missing and the other
              # is unexpected.
              return re.sub(r"[-_.]+", "-", name).lower()

          def licence_files(dist):
              root = Path(str(dist._path))
              found = []
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  if LICENCE_FILE_NAME.match(path.name):
                      found.append(path)
                      continue
                  relative = path.relative_to(root)
                  if len(relative.parts) > 1 and LICENCE_DIR_NAME.match(relative.parts[0]):
                      found.append(path)
              return found

          def label_for(dist):
              expression = dist.metadata.get("License-Expression")
              if expression:
                  return str(expression).strip(), "License-Expression"
              legacy = dist.metadata.get("License")
              # A short legacy field holds a licence identifier; a long one
              # holds the whole licence text, and tokenising that would invent
              # a licence out of prose.
              if legacy and len(str(legacy)) <= 200:
                  tokens = SPDX_TOKEN.findall(str(legacy))
                  if tokens:
                      return "+".join(tokens), f"License ({str(legacy).strip()})"
              classifiers = [
                  c.rsplit("::", 1)[-1].strip()
                  for c in (dist.metadata.get_all("Classifier") or [])
                  if c.startswith("License ::")
              ]
              known = [CLASSIFIER_LABELS[c] for c in classifiers if c in CLASSIFIER_LABELS]
              if known:
                  return "+".join(known), f"classifier {classifiers}"
              for path in licence_files(dist):
                  try:
                      text = path.read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      continue
                  for label, pattern in TEXT_RULES:
                      if pattern.search(text):
                          return label, f"{path.relative_to(Path(str(dist._path)))}"
              return "UNRESOLVED", "no metadata, no classifier, no recognisable licence file"

          installed = {}
          for dist in metadata.distributions():
              name = dist.metadata["Name"]
              if name:
                  installed[canonical(name)] = (name, dist.metadata["Version"], dist)

          # --- the closure the lockfile names -------------------------------
          expected = {}
          requirements_path = Path(
              os.environ.get("RELEASE_REQUIREMENTS", "release-requirements.txt")
          )
          for raw in requirements_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if ";" in line:
                  requirement, marker = line.split(";", 1)
                  if not Marker(marker.strip()).evaluate():
                      continue
              else:
                  requirement = line
              requirement = requirement.strip()
              if "==" in requirement:
                  name, version = requirement.split("==", 1)
                  expected[canonical(name)] = version.strip()

          failures = []
          if not expected:
              failures.append("the export named no distributions, so the audit is vacuous")

          missing = sorted(set(expected) - set(installed))
          extra = sorted(set(installed) - set(expected))
          if missing:
              failures.append(
                  f"the lockfile names these distributions and they are not installed: {missing}"
              )
          if extra:
              failures.append(
                  f"these distributions are installed and the lockfile does not name them: {extra}"
              )
          for key, version in sorted(expected.items()):
              if key in installed and installed[key][1] != version:
                  failures.append(
                      f"{installed[key][0]} is installed at {installed[key][1]} but the "
                      f"lockfile pins {version}"
                  )

          census = Counter()
          for key, (name, version, dist) in sorted(installed.items()):
              label, source = label_for(dist)
              census[label] += 1
              if label == "UNRESOLVED":
                  failures.append(
                      f"{name} {version}: its licence could not be read from the "
                      f"distribution ({source})"
                  )
                  continue
              tokens = [t for t in re.split(r"\s+(?:AND|OR)\s+|\+", label) if t]
              for token in tokens:
                  if token in PERMISSIVE:
                      continue
                  allowed = CONDITIONAL.get(token)
                  if allowed is None:
                      failures.append(
                          f"{name} {version} is under {token!r}, which the release "
                          "does not record. Read it, then record it in NOTICE and "
                          "in the workflow's CONDITIONAL map."
                      )
                  elif name not in allowed:
                      failures.append(
                          f"{name} {version} is under {token!r}, which is only "
                          f"recorded for {sorted(allowed)}"
                      )

          print(f"platform: {sys.platform}")
          print("licence census of the installed closure:")
          for label, count in sorted(census.items()):
              print(f"  {count:>4}  {label}")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              raise SystemExit(1)
          print(f"every one of the {len(installed)} installed distributions carries a "
                "licence the release records")
          PY
