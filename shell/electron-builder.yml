# Minimal unsigned Windows installer for the local-first desktop shell.
# A per-user NSIS target is the smallest artifact that can support T09's
# install/launch/upgrade/uninstall drill. Signing is deliberately absent (W28).
appId: org.labcairn.shell
productName: LabCairn
# The caller sets LABCAIRN_SHELL_DIST_DIR to a directory outside the
# checkout; packaging products and logs never live in the tracked tree.
directories:
  output: ${env.LABCAIRN_SHELL_DIST_DIR}
# electron-builder requires electron in devDependencies. The shell declares it
# as a dependency for the approved npm surface, so the packaged app's metadata
# clears that declaration instead of changing the manifest the witness reads.
extraMetadata:
  dependencies: null
files:
  - src/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web-dist
    filter:
      - '**/*'
  # O3's frozen backend (decided 2026-11-14): the whole onedir tree PyInstaller
  # produced, carried at `resources/backend/labcairn` — the place the package's
  # own `shell-env.json` names in its installation-relative form
  # (`"cliPath": "backend/labcairn"`). The tree is a build product: the
  # `beforeBuild` guard below refuses the build when it is absent, and the
  # freeze that produces it is `node shell/scripts/build-backend-freeze.mjs`.
  - from: build/backend-freeze/labcairn
    to: backend/labcairn
    filter:
      - '**/*'
  # T09's two supply templates travel in the package. The JSON template becomes
  # the package's own `resources/shell-env.json` only when the owner renames it;
  # the launcher template is copied next to LabCairn.exe and edited. Neither is
  # read until it exists under its live name — a template is not a default.
  - from: shell-env.template.json
    to: shell-env.template.json
  - from: labcairn-shell.cmd
    to: labcairn-shell.cmd
# The packaged window loads the web bundle from `resources/web-dist`, and the
# service runs from the frozen backend at `resources/backend/labcairn`. When a
# source directory is absent electron-builder warns -- one `file source doesn't
# exist` line per missing path -- and keeps going, so an installer without the
# frontend would ship; measured on 2026-11-11, such a build exited 0. This hook
# turns a missing bundle or a missing frozen backend into a build failure.
beforeBuild: scripts/require-package-inputs.mjs
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # The licence texts the installer carries. LGPL-2.1 section 1 requires a
  # copy of the Licence to travel with the Library, and the plug-ins are
  # distributed inside this installer rather than as installed files — so the
  # texts have to be in the installer's own $PLUGINSDIR, beside the binaries
  # they govern. `shell/nsis/licenses.nsh` declares the macro that puts them
  # there; `shell/licenses/README.txt` records where each text came from.
  include: nsis/licenses.nsh
